services:
  app:
    environment:
      - XDEBUG_MODE=develop,debug
      - XDEBUG_CONFIG=client_host=host.docker.internal
    volumes:
      - ./app:/app/app
      - ./routes:/app/routes
      - ./database:/app/database
      - ./resources:/app/resources
      - ./config:/app/config

  mysql:
    ports:
      - "3306:3306"
